<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"><meta name="theme-color" content="#f5f4ef"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="作業台"><meta name="description" content="貼る、変換、コピー。iPhone向けの軽量なテキスト作業台。本文は外部へ送信しません。"><title>テキスト作業台</title><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="icon.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><script defer src="transforms.js"></script><script defer src="app.js"></script></head><body><main id="app"><header><div class="brand"><span class="mark">T</span><h1>テキスト作業台</h1></div><div class="history"><button id="undo" aria-label="元に戻す" title="元に戻す">↶</button><button id="redo" aria-label="やり直す" title="やり直す">↷</button><button data-panel="その他" aria-label="その他メニュー">···</button></div></header><section class="work"><textarea id="editor" aria-label="加工するテキスト" placeholder="ここに貼り付ける\n\n選択した部分だけ、変換もできる。" spellcheck="false" autocapitalize="off"></textarea><div class="metadata"><span id="stats">0文字 · 0行</span><span id="scope">全文が対象</span></div></section><footer><nav aria-label="変換カテゴリ"><button data-panel="置換">置換</button><button data-panel="空白">空白</button><button data-panel="改行">改行</button><button data-panel="文字">文字</button><button data-panel="その他">その他</button></nav><div class="primary"><button id="paste">貼り付け</button><button id="copy">コピー <span>↗</span></button></div></footer><div id="toast" role="status" aria-live="polite" hidden><span></span><button id="toastUndo">元に戻す</button></div><div id="shade" hidden></div><section id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden><div class="sheet-head"><div><h2 id="sheetTitle"></h2><p id="sheetScope"></p></div><button id="close" aria-label="閉じる">×</button></div><div id="panel"></div></section></main></body></html>
