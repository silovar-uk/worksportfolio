name: Normalize canonical private boundary

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/normalize-private-boundary.mjs'
      - '.github/workflows/normalize-private-boundary.yml'

permissions:
  contents: write

concurrency:
  group: worksportfolio-normalize-private-boundary
  cancel-in-progress: true

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Normalize private-safe records
        run: node scripts/normalize-private-boundary.mjs

      - name: Validate Private summaries
        run: node scripts/validate-private-summaries.mjs

      - name: Commit normalized boundary
        run: |
          if [ -z "$(git status --porcelain -- data/projects.json data/manual-projects-private.json)" ]; then
            echo "Private boundary is already normalized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json data/manual-projects-private.json
          git commit -m "Separate private summaries from canonical public registry"
          git pull --rebase origin main
          git push
