name: Update REDS CALENDAR

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *' # every 2 hours
  push:
    paths:
      - 'redscalender/build.py'
      - 'redscalender/template.html'
      - '.github/workflows/update-redscalendar.yml'

permissions:
  contents: write

concurrency:
  group: update-redscalendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install parser dependency
        run: python -m pip install --disable-pip-version-check lxml
      - name: Fetch official schedules and build feeds
        run: python redscalender/build.py
      - name: Validate generated output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('redscalender')
          data = json.loads((root / 'schedule.json').read_text())
          expected = {'men', 'ladies', 'u21', 'youth'}
          assert set(data['teams']) == expected, data['teams'].keys()
          assert len(data['teams']['men']) >= 20
          assert len(data['teams']['ladies']) >= 20
          assert len(data['teams']['u21']) >= 10
          assert len(data['teams']['youth']) == 18
          assert data.get('pastWindowDays') == 14
          for rows in data['teams'].values():
              for row in rows:
                  if row.get('resultConfirmed'):
                      assert row.get('result')
                      assert isinstance(row['result'].get('scoreFor'), int)
                      assert isinstance(row['result'].get('scoreAgainst'), int)
          for name in ['men.ics','ladies.ics','u21.ics','youth.ics','all.ics','index.html']:
              assert (root / name).exists(), name
          print({team: len(rows) for team, rows in data['teams'].items()})
          html = (root / 'index.html').read_text()
          script = html.split('<script>', 1)[1].rsplit('</script>', 1)[0]
          Path('/tmp/redscalender.js').write_text(script)
          PY
          node --check /tmp/redscalender.js
          git diff --check -- redscalender/build.py redscalender/template.html redscalender/index.html redscalender/schedule.json .github/workflows/update-redscalendar.yml
      - name: Commit changed schedule files
        run: |
          if git diff --quiet -- redscalender; then
            echo 'No schedule changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add redscalender
          git commit -m 'Update REDS CALENDAR schedules'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push raced with another workflow; retrying ($attempt/3)."
            sleep $((attempt * 2))
          done
          exit 1
