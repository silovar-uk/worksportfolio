name: Add UI ColLabo to portfolio

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-ui-collabo.yml'

permissions:
  contents: write

jobs:
  add-project:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Add canonical UI ColLabo record
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'data/projects.json';
          const projects = JSON.parse(fs.readFileSync(path, 'utf8'));
          const id = 'ui-collabo';
          if (!projects.some((project) => project && project.id === id)) {
            projects.push({
              id,
              title: 'UI ColLabo',
              subtitle: '「なんか違う」を、AIに伝わるUI改善指示へ変える',
              summary: 'スクリーンショット上で気になる箇所を指し、意図を選ぶだけで、曖昧なデザインフィードバックをAIが読める具体的な指示文へ整える下ごしらえアプリ。',
              friction: 'UIを見て「なんか違う」と感じても、変更箇所と意図を具体的な言葉にし、AIや実装担当へ伝えるのが難しかった。',
              firstBuild: 'スクリーンショットへ指摘を置き、改善意図を選んで、実装に渡せる指示文へ変換する流れを作った。',
              currentAnswer: '画面を見ながら「どこを・どうしたいか」を選び、デザインレビューを構造化されたAI向け指示へ変換するUIコラボレーションツール。',
              type: 'learning-tool',
              verbs: ['学ぶ', '指摘する', '言語化する'],
              status: 'active',
              visibility: 'public',
              featured: false,
              createdAt: '2026-09-07',
              createdAtPrecision: 'day',
              updatedAt: '2026-09-07',
              startedAt: '2026-09-07',
              startedAtPrecision: 'day',
              startedAtBasis: 'repository-created',
              repositoryUrl: 'https://github.com/silovar-uk/ui-collabo',
              githubId: '1359734457',
              liveUrl: 'https://silovar-uk.github.io/ui-collabo/',
              liveUrlStatus: 'confirmed',
              technologies: ['Preact', 'TypeScript', 'Vite', 'Signals', 'Vitest'],
              documentationState: 'verified',
              relatedProjects: [],
              updates: [{
                date: '2026-09-07',
                version: '0.1',
                change: 'UIレビューの下ごしらえアプリをポートフォリオへ追加',
                reason: '曖昧な見た目の違和感を、AIや実装担当へ渡せる具体的な指示へ変える流れを整理するため。'
              }],
              aside: '「なんか違う」を、そのままにしない。',
              searchAliases: ['UI ColLabo', 'ui collabo', 'UIレビュー', 'デザインレビュー', 'デザインフィードバック', 'AI指示', 'スクリーンショット', 'UI改善', 'フィードバック'],
              portfolioFamilies: [],
              makingPrinciples: []
            });
            fs.writeFileSync(path, `${JSON.stringify(projects, null, 2)}\n`, 'utf8');
          }
          NODE

      - name: Build canonical portfolio outputs
        run: |
          node scripts/build-catalog.mjs
          node scripts/sanitize-project-data.mjs
          node scripts/validate-global-ids.mjs
          node scripts/validate-portfolio-model.mjs
          node scripts/build-editorial-review.mjs
          node scripts/validate-pattern-candidates.mjs
          node scripts/build-patterns.mjs
          node scripts/validate-patterns.mjs
          rm -f index.html
          node scripts/build-static-site.mjs
          node scripts/apply-copy-cleanup.mjs
          node scripts/apply-editorial-gate.mjs
          node scripts/inject-private-summaries.mjs
          node scripts/inject-showcase.mjs
          node scripts/split-project-data.mjs

      - name: Verify UI ColLabo category
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const projects = JSON.parse(fs.readFileSync('data/projects.json', 'utf8'));
          const project = projects.find((item) => item && item.id === 'ui-collabo');
          if (!project) throw new Error('ui-collabo record missing');
          if (project.type !== 'learning-tool') throw new Error(`Unexpected type: ${project.type}`);
          if (project.liveUrl !== 'https://silovar-uk.github.io/ui-collabo/') throw new Error(`Unexpected liveUrl: ${project.liveUrl}`);
          const html = fs.readFileSync('index.html', 'utf8');
          if (!html.includes('UI ColLabo')) throw new Error('Generated index does not include UI ColLabo');
          NODE

      - name: Remove migration workflow and commit
        run: |
          git rm .github/workflows/add-ui-collabo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data index.html .github/workflows/add-ui-collabo.yml
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing to commit."
            exit 0
          fi
          git commit -m "Add UI ColLabo to learning tools"
          git push
