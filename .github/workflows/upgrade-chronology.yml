name: Upgrade portfolio chronology

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/upgrade-chronology.mjs'
      - '.github/workflows/upgrade-chronology.yml'

permissions:
  contents: write

concurrency:
  group: worksportfolio-chronology-upgrade
  cancel-in-progress: true

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply chronology upgrade
        run: node scripts/upgrade-chronology.mjs

      - name: Validate upgraded scripts
        run: |
          node --check catalog.js
          node --check favorite-catalog.js
          node --check scripts/build-static-site.mjs
          grep -q '制作開始が新しい順' catalog.js
          grep -Fq "project?.startedAt || project?.createdAt" catalog.js
          grep -q "defaultSort.*created-desc" data/portfolio-config.json
          grep -q "node --check catalog.js" .github/workflows/update-catalog.yml

      - name: Commit upgraded chronology
        run: |
          if git diff --quiet -- catalog.js favorite-catalog.js data/portfolio-config.json .github/workflows/update-catalog.yml; then
            echo "Chronology is already upgraded."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog.js favorite-catalog.js data/portfolio-config.json .github/workflows/update-catalog.yml
          git commit -m "Use project start dates for portfolio chronology"
          git pull --rebase origin main
          git push
