name: Build portfolio site

on:
  workflow_dispatch:
  schedule:
    - cron: '15 21 * * *'
  pull_request:
    branches:
      - main
    paths:
      - 'data/projects.json'
      - 'data/private-projects.json'
      - 'data/periods.json'
      - 'data/settings.json'
      - 'data/portfolio-config.json'
      - 'data/portfolio-taxonomy.json'
      - 'data/editorial-policy.json'
      - 'data/project-start-dates.json'
      - 'data/pattern-taxonomy.json'
      - 'data/pattern-audit.json'
      - 'data/pattern-candidates-*.json'
      - 'data/pattern-merge-rules.json'
      - 'src/index.template.html'
      - '*.js'
      - '*.css'
      - 'scripts/*.mjs'
      - 'tests/**'
      - '.github/workflows/update-catalog.yml'
  push:
    branches:
      - main
    paths:
      - 'data/projects.json'
      - 'data/private-projects.json'
      - 'data/periods.json'
      - 'data/settings.json'
      - 'data/portfolio-config.json'
      - 'data/portfolio-taxonomy.json'
      - 'data/editorial-policy.json'
      - 'data/project-start-dates.json'
      - 'data/pattern-taxonomy.json'
      - 'data/pattern-audit.json'
      - 'data/pattern-candidates-*.json'
      - 'data/pattern-merge-rules.json'
      - 'src/index.template.html'
      - '*.js'
      - '*.css'
      - 'scripts/*.mjs'
      - 'tests/**'
      - '.github/workflows/update-catalog.yml'

permissions:
  contents: write

concurrency:
  group: worksportfolio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check core interface and build scripts
        run: |
          node --check home-shell.js
          node --check catalog.js
          node --check project-detail.js
          node --check scripts/build-catalog.mjs
          node --check scripts/sanitize-project-data.mjs
          node --check scripts/build-static-site.mjs
          node --check scripts/apply-copy-cleanup.mjs
          node --check scripts/build-editorial-review.mjs
          node --check scripts/validate-portfolio-model.mjs
          node --check scripts/validate-global-ids.mjs
          node --check scripts/curate-recent-projects.mjs
          node --check scripts/audit-portfolio.mjs
          node --check scripts/validate-private-summaries.mjs
          node --check scripts/validate-pattern-candidates.mjs
          node --check scripts/build-patterns.mjs
          node --check scripts/validate-patterns.mjs

      - name: Validate source-of-truth boundary
        run: |
          test -s data/projects.json
          test -s data/private-projects.json
          test -s data/settings.json
          test -s src/index.template.html
          test ! -e data/manual-projects.json
          test ! -e data/manual-projects-extra.json
          test ! -e data/manual-projects-daily-log.json
          test ! -e data/manual-projects-private.json
          test ! -e loader.js
          node - <<'NODE'
          const fs = require('fs');
          const projects = JSON.parse(fs.readFileSync('data/projects.json', 'utf8'));
          const config = JSON.parse(fs.readFileSync('data/portfolio-config.json', 'utf8'));
          const template = fs.readFileSync('src/index.template.html', 'utf8');
          if ('overrides' in config) throw new Error('Project metadata must not live in portfolio-config.overrides');
          for (const project of projects) {
            if (project?.sourceVisibility === 'private' || project?.summaryOnly === true) {
              throw new Error(`Private summary leaked into canonical public registry: ${project?.id || '(missing)'}`);
            }
          }
          for (const marker of ['BUILD_DIARY_DATA', 'data-view-button="timeline"', 'data-view-button="shelf"', 'data-view-button="map"']) {
            if (template.includes(marker)) throw new Error(`Legacy source architecture returned: ${marker}`);
          }
          if (!template.includes('__WORKS_PORTFOLIO_SEARCH_INDEX__')) throw new Error('Search-index placeholder missing from source template.');
          console.log(`Canonical public boundary valid: ${projects.length} project records; source template is Core-only.`);
          NODE

      - name: Validate Private summaries
        run: node scripts/validate-private-summaries.mjs

      - name: Build GitHub catalog
        run: node scripts/build-catalog.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize project-derived data
        run: node scripts/sanitize-project-data.mjs

      - name: Validate global identifiers
        run: node scripts/validate-global-ids.mjs

      - name: Validate portfolio model
        run: node scripts/validate-portfolio-model.mjs

      - name: Build editorial review queue
        run: node scripts/build-editorial-review.mjs

      - name: Validate pattern candidates
        run: node scripts/validate-pattern-candidates.mjs

      - name: Build formal patterns
        run: node scripts/build-patterns.mjs

      - name: Validate formal patterns
        run: node scripts/validate-patterns.mjs

      - name: Build progressive production data
        run: |
          rm -f index.html data/catalog-projects.json
          rm -rf data/project-details
          node scripts/build-static-site.mjs

      - name: Validate progressive core output
        run: node scripts/apply-copy-cleanup.mjs

      - name: Verify generated data boundaries
        run: |
          test -s index.html
          test -s data/catalog-projects.json
          test -s data/patterns.json
          test -s data/editorial-review.json
          test -d data/project-details
          test "$(find data/project-details -type f -name '*.json' | wc -l)" -gt 0
          ! grep -qi 'jszip' index.html
          ! grep -qi 'loader.js' index.html
          ! grep -q '__WORKS_PORTFOLIO_SEARCH_INDEX__' index.html
          grep -q 'window.WORKS_PORTFOLIO_SEARCH_INDEX' index.html
          ! grep -q 'BUILD_DIARY_DATA' index.html
          ! grep -q 'WORKS_PORTFOLIO_SHOWCASE' index.html
          ! grep -q 'WORKS_PORTFOLIO_CONFIG' index.html
          ! grep -q 'WORKS_PORTFOLIO_REPOSITORIES' index.html
          ! grep -q 'WORKS_PORTFOLIO_START_DATES' index.html
          grep -q 'search-inline-catalog-fetch-detail-on-demand' index.html
          grep -q 'home-shell.js' index.html
          grep -q 'catalog.js' index.html
          grep -q 'project-detail.js' index.html
          grep -q 'data/catalog-projects.json' catalog.js
          grep -q 'data/project-details/' project-detail.js
          grep -q 'data-header-search-input' index.html
          grep -q 'data-home-friction="reduce"' index.html
          grep -q 'data-home-surprise' index.html
          grep -q 'すべての制作物' index.html
          ! grep -q 'live-index.js' index.html
          ! grep -q 'friction-atlas.js' index.html
          ! grep -q 'random-three.js' index.html
          ! grep -q 'catalog-list-first.js' index.html
          ! grep -q 'catalog-visibility.js' index.html
          ! grep -q 'showcase.js' index.html
          ! grep -q 'private-source.js' index.html
          ! grep -q 'WORKS_PORTFOLIO_LAZY_ASSETS' index.html
          ! grep -q 'requestIdleCallback' index.html
          ! grep -q 'location.reload' home-shell.js
          ! grep -q 'location.reload' catalog.js
          ! grep -q 'location.reload' project-detail.js
          ! grep -q 'MutationObserver' home-shell.js
          ! grep -q 'MutationObserver' catalog.js
          ! grep -q 'MutationObserver' project-detail.js
          grep -q 'Source not public' catalog.js
          ! grep -q 'github.com/silovar-uk/uicleaner' index.html
          ! grep -q 'github.com/silovar-uk/private-memo' index.html
          ! grep -q 'github.com/silovar-uk/prompt-caller' index.html
          grep -q '"publicRepositoriesOnly": true' data/editorial-review.json
          ! grep -qi 'private-memo' data/editorial-review.json
          ! grep -qi 'karaoke-db' data/editorial-review.json
          ! grep -qi 'prompt-caller' data/editorial-review.json
          ! grep -qi 'uicleaner' data/editorial-review.json
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const marker = 'window.WORKS_PORTFOLIO_SEARCH_INDEX =';
          const start = html.indexOf(marker) + marker.length;
          const end = html.indexOf('</script>', start);
          if (start < marker.length || end < 0) throw new Error('Cannot read inline search index.');
          const search = JSON.parse(html.slice(start, end).trim().replace(/;\s*$/, ''));
          const catalog = JSON.parse(fs.readFileSync('data/catalog-projects.json', 'utf8'));
          if (!Array.isArray(search) || !Array.isArray(catalog.projects)) throw new Error('Runtime data payload shape invalid.');
          if (search.length !== catalog.projects.length) throw new Error(`Search/Catalog count mismatch: ${search.length} vs ${catalog.projects.length}`);
          const privateSummaryIds = search.filter((item) => item.summaryOnly).map((item) => item.id);
          for (const id of privateSummaryIds) {
            const path = `data/project-details/${encodeURIComponent(id)}.json`;
            if (fs.existsSync(path)) throw new Error(`Summary-only project must not expose a detail file: ${id}`);
          }
          console.log(`Runtime boundary OK: ${search.length} search records, ${catalog.projects.length} catalog records, ${privateSummaryIds.length} summary-only projects without detail files.`);
          NODE

      - name: Enforce performance budgets
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const marker = 'window.WORKS_PORTFOLIO_SEARCH_INDEX =';
          const start = html.indexOf(marker) + marker.length;
          const end = html.indexOf('</script>', start);
          if (start < marker.length || end < 0) throw new Error('Cannot measure inline search index.');
          const searchBytes = Buffer.byteLength(html.slice(start, end).trim().replace(/;\s*$/, ''));
          const indexBytes = Buffer.byteLength(html);
          const catalogBytes = fs.statSync('data/catalog-projects.json').size;
          const coreJsBytes = ['home-shell.js', 'catalog.js', 'project-detail.js'].reduce((sum, path) => sum + fs.statSync(path).size, 0);
          const budgets = { index: 90000, search: 50000, catalog: 70000, coreJs: 60000 };
          if (indexBytes > budgets.index) throw new Error(`index.html budget exceeded: ${indexBytes} > ${budgets.index}`);
          if (searchBytes > budgets.search) throw new Error(`inline search budget exceeded: ${searchBytes} > ${budgets.search}`);
          if (catalogBytes > budgets.catalog) throw new Error(`catalog payload budget exceeded: ${catalogBytes} > ${budgets.catalog}`);
          if (coreJsBytes > budgets.coreJs) throw new Error(`core JS budget exceeded: ${coreJsBytes} > ${budgets.coreJs}`);
          console.log(`Performance budgets OK: index ${indexBytes}/${budgets.index}; search ${searchBytes}/${budgets.search}; catalog ${catalogBytes}/${budgets.catalog}; core JS ${coreJsBytes}/${budgets.coreJs}.`);
          NODE

      - name: Show generated changes
        run: git diff --stat -- data/projects.json data/portfolio-config.json data/catalog.json data/editorial-review.json data/project-start-dates.json data/pattern-audit.json data/pattern-candidates-01.json data/pattern-candidates-02.json data/pattern-candidates-03.json data/pattern-merge-rules.json data/patterns.json data/catalog-projects.json data/project-details index.html

      - name: Commit generated files when changed
        if: github.event_name != 'pull_request'
        run: |
          FILES="data/projects.json data/portfolio-config.json data/catalog.json data/editorial-review.json data/project-start-dates.json data/pattern-audit.json data/pattern-candidates-01.json data/pattern-candidates-02.json data/pattern-candidates-03.json data/pattern-merge-rules.json data/patterns.json data/catalog-projects.json data/project-details index.html"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "Portfolio and derived data are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+silovar-uk@users.noreply.github.com"
          git add $FILES
          git commit -m "Build canonical static portfolio"
          git pull --rebase origin main
          git push
