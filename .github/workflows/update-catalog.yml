name: Build portfolio site

on:
  workflow_dispatch:
  schedule:
    - cron: '15 21 * * *'
  pull_request:
    branches:
      - main
    paths:
      - 'data/portfolio-config.json'
      - 'data/manual-projects.json'
      - 'data/manual-projects-extra.json'
      - 'data/project-start-dates.json'
      - 'data/pattern-taxonomy.json'
      - 'data/pattern-audit.json'
      - 'data/pattern-candidates-*.json'
      - 'data/pattern-merge-rules.json'
      - 'taxonomy.js'
      - 'taxonomy.css'
      - 'floating-random.js'
      - 'floating-random.css'
      - 'random-three.js'
      - 'random-three.css'
      - 'comparison-view.js'
      - 'comparison-view.css'
      - 'motion.js'
      - 'motion.css'
      - 'favorites.js'
      - 'favorites.css'
      - 'favorite-catalog.js'
      - 'copy-cleanup.js'
      - 'copy-cleanup.css'
      - 'scripts/build-catalog.mjs'
      - 'scripts/sanitize-project-data.mjs'
      - 'scripts/build-static-site.mjs'
      - 'scripts/apply-copy-cleanup.mjs'
      - 'scripts/validate-pattern-candidates.mjs'
      - 'scripts/build-patterns.mjs'
      - 'scripts/validate-patterns.mjs'
      - '.github/workflows/update-catalog.yml'
  push:
    branches:
      - main
    paths:
      - 'data/portfolio-config.json'
      - 'data/manual-projects.json'
      - 'data/manual-projects-extra.json'
      - 'data/project-start-dates.json'
      - 'data/pattern-taxonomy.json'
      - 'data/pattern-audit.json'
      - 'data/pattern-candidates-*.json'
      - 'data/pattern-merge-rules.json'
      - 'taxonomy.js'
      - 'taxonomy.css'
      - 'floating-random.js'
      - 'floating-random.css'
      - 'random-three.js'
      - 'random-three.css'
      - 'comparison-view.js'
      - 'comparison-view.css'
      - 'motion.js'
      - 'motion.css'
      - 'favorites.js'
      - 'favorites.css'
      - 'favorite-catalog.js'
      - 'copy-cleanup.js'
      - 'copy-cleanup.css'
      - 'scripts/build-catalog.mjs'
      - 'scripts/sanitize-project-data.mjs'
      - 'scripts/build-static-site.mjs'
      - 'scripts/apply-copy-cleanup.mjs'
      - 'scripts/validate-pattern-candidates.mjs'
      - 'scripts/build-patterns.mjs'
      - 'scripts/validate-patterns.mjs'
      - '.github/workflows/update-catalog.yml'

permissions:
  contents: write

concurrency:
  group: worksportfolio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check interface scripts
        run: |
          node --check taxonomy.js
          node --check floating-random.js
          node --check random-three.js
          node --check comparison-view.js
          node --check motion.js
          node --check favorites.js
          node --check favorite-catalog.js
          node --check copy-cleanup.js
          node --check scripts/build-catalog.mjs
          node --check scripts/sanitize-project-data.mjs
          node --check scripts/build-static-site.mjs
          node --check scripts/apply-copy-cleanup.mjs
          node --check scripts/validate-pattern-candidates.mjs
          node --check scripts/build-patterns.mjs
          node --check scripts/validate-patterns.mjs

      - name: Build GitHub catalog
        run: node scripts/build-catalog.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize project-derived data
        run: node scripts/sanitize-project-data.mjs

      - name: Validate pattern candidates
        run: node scripts/validate-pattern-candidates.mjs

      - name: Build formal patterns
        run: node scripts/build-patterns.mjs

      - name: Validate formal patterns
        run: node scripts/validate-patterns.mjs

      - name: Build static portfolio
        run: node scripts/build-static-site.mjs

      - name: Apply natural copy
        run: node scripts/apply-copy-cleanup.mjs

      - name: Inject favorite catalog controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="favorite-catalog.js?v=${{ github.sha }}"></script>'
          if 'favorite-catalog.js' not in html:
              html = html.replace('</body>', tag + '</body>')
          path.write_text(html, encoding='utf-8')
          PY

      - name: Verify generated page
        run: |
          test -s index.html
          test -s data/patterns.json
          ! grep -qi 'jszip' index.html
          ! grep -qi 'loader.js' index.html
          grep -q 'window.BUILD_DIARY_DATA' index.html
          grep -q 'worksportfolio-assets-version' index.html
          grep -q 'shelf-priority.js' index.html
          grep -q 'random-three.js' index.html
          grep -q 'random-three.css' index.html
          grep -q 'floating-random.js' index.html
          grep -q 'floating-random.css' index.html
          grep -q 'comparison-view.js' index.html
          grep -q 'comparison-view.css' index.html
          grep -q 'favorites.js' index.html
          grep -q 'favorites.css' index.html
          grep -q 'favorite-catalog.js' index.html
          grep -q 'copy-cleanup.js' index.html
          grep -q 'copy-cleanup.css' index.html
          grep -q 'ランダム3枚' random-three.js
          grep -q '3枚引き直す' random-three.js
          ! grep -q '残り2枚を引く' random-three.js
          ! grep -q 'data-random-three-keep' random-three.js
          grep -q 'data-compare-toggle' random-three.js
          grep -q 'data-card-mark' random-three.js
          grep -q '3枚引き直す' floating-random.js
          ! grep -q 'ランダムで1本' floating-random.js
          grep -q 'worksPortfolioFavoriteRatingsV1' favorites.js
          grep -q 'お気に入り度が高い順' favorite-catalog.js
          grep -q '制作開始が新しい順' favorite-catalog.js
          grep -q 'startedAt' index.html
          grep -q 'project-start-dates.json' scripts/build-static-site.mjs
          grep -q '確認状況' copy-cleanup.js
          grep -Fq "return event.target.closest('.portfolio-pick-card,.catalog-card');" motion.js
          ! grep -Fq "return event.target.closest('.portfolio-pick-card,.catalog-card,[data-project-surface]');" motion.js
          grep -Fq '[data-project-surface],[data-project-surface]:hover{transform:none!important' motion.css
          grep -Fq "d.settings.defaultView='shelf'" index.html
          grep -Fq "d.settings.defaultSort='created-desc'" index.html
          ! grep -q '<button class="text-action" type="button" data-random-button>' index.html

      - name: Show generated changes
        run: git diff --stat -- data/portfolio-config.json data/catalog.json data/project-start-dates.json data/pattern-audit.json data/pattern-candidates-01.json data/pattern-candidates-02.json data/pattern-candidates-03.json data/pattern-merge-rules.json data/patterns.json index.html

      - name: Commit generated files when changed
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- data/portfolio-config.json data/catalog.json data/project-start-dates.json data/pattern-audit.json data/pattern-candidates-01.json data/pattern-candidates-02.json data/pattern-candidates-03.json data/pattern-merge-rules.json data/patterns.json index.html; then
            echo "Portfolio and pattern data are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/portfolio-config.json data/catalog.json data/project-start-dates.json data/pattern-audit.json data/pattern-candidates-01.json data/pattern-candidates-02.json data/pattern-candidates-03.json data/pattern-merge-rules.json data/patterns.json index.html
          git commit -m "Build static portfolio and pattern data"
          git push
