name: Build portfolio site

on:
  workflow_dispatch:
  schedule:
    - cron: '15 21 * * *'
  pull_request:
    branches:
      - main
    paths:
      - 'data/projects.json'
      - 'data/private-projects.json'
      - 'data/periods.json'
      - 'data/settings.json'
      - 'data/portfolio-config.json'
      - 'data/portfolio-taxonomy.json'
      - 'data/editorial-policy.json'
      - 'data/project-start-dates.json'
      - 'data/pattern-taxonomy.json'
      - 'data/pattern-audit.json'
      - 'data/pattern-candidates-*.json'
      - 'data/pattern-merge-rules.json'
      - 'src/index.template.html'
      - '*.js'
      - '*.css'
      - 'scripts/*.mjs'
      - '.github/workflows/update-catalog.yml'
  push:
    branches:
      - main
    paths:
      - 'data/projects.json'
      - 'data/private-projects.json'
      - 'data/periods.json'
      - 'data/settings.json'
      - 'data/portfolio-config.json'
      - 'data/portfolio-taxonomy.json'
      - 'data/editorial-policy.json'
      - 'data/project-start-dates.json'
      - 'data/pattern-taxonomy.json'
      - 'data/pattern-audit.json'
      - 'data/pattern-candidates-*.json'
      - 'data/pattern-merge-rules.json'
      - 'src/index.template.html'
      - '*.js'
      - '*.css'
      - 'scripts/*.mjs'
      - '.github/workflows/update-catalog.yml'

permissions:
  contents: write

concurrency:
  group: worksportfolio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check core interface and build scripts
        run: |
          node --check home-shell.js
          node --check catalog.js
          node --check scripts/build-catalog.mjs
          node --check scripts/sanitize-project-data.mjs
          node --check scripts/build-static-site.mjs
          node --check scripts/apply-copy-cleanup.mjs
          node --check scripts/apply-editorial-gate.mjs
          node --check scripts/build-editorial-review.mjs
          node --check scripts/inject-showcase.mjs
          node --check scripts/split-project-data.mjs
          node --check scripts/validate-portfolio-model.mjs
          node --check scripts/validate-global-ids.mjs
          node --check scripts/curate-recent-projects.mjs
          node --check scripts/audit-portfolio.mjs
          node --check scripts/validate-private-summaries.mjs
          node --check scripts/inject-private-summaries.mjs
          node --check scripts/validate-pattern-candidates.mjs
          node --check scripts/build-patterns.mjs
          node --check scripts/validate-patterns.mjs

      - name: Validate source-of-truth boundary
        run: |
          test -s data/projects.json
          test -s data/private-projects.json
          test -s data/periods.json
          test -s data/settings.json
          test -s src/index.template.html
          test ! -e data/manual-projects.json
          test ! -e data/manual-projects-extra.json
          test ! -e data/manual-projects-daily-log.json
          test ! -e data/manual-projects-private.json
          test ! -e loader.js
          node - <<'NODE'
          const fs = require('fs');
          const projects = JSON.parse(fs.readFileSync('data/projects.json', 'utf8'));
          const config = JSON.parse(fs.readFileSync('data/portfolio-config.json', 'utf8'));
          if ('overrides' in config) throw new Error('Project metadata must not live in portfolio-config.overrides');
          for (const project of projects) {
            if (project?.sourceVisibility === 'private' || project?.summaryOnly === true) {
              throw new Error(`Private summary leaked into canonical public registry: ${project?.id || '(missing)'}`);
            }
          }
          console.log(`Canonical public boundary valid: ${projects.length} project records.`);
          NODE

      - name: Validate Private summaries
        run: node scripts/validate-private-summaries.mjs

      - name: Build GitHub catalog
        run: node scripts/build-catalog.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sanitize project-derived data
        run: node scripts/sanitize-project-data.mjs

      - name: Validate global identifiers
        run: node scripts/validate-global-ids.mjs

      - name: Validate portfolio model
        run: node scripts/validate-portfolio-model.mjs

      - name: Build editorial review queue
        run: node scripts/build-editorial-review.mjs

      - name: Validate pattern candidates
        run: node scripts/validate-pattern-candidates.mjs

      - name: Build formal patterns
        run: node scripts/build-patterns.mjs

      - name: Validate formal patterns
        run: node scripts/validate-patterns.mjs

      - name: Prove clean static build
        run: |
          rm -f index.html
          node scripts/build-static-site.mjs

      - name: Validate stable core output
        run: node scripts/apply-copy-cleanup.mjs

      - name: Apply editorial publication gate
        run: node scripts/apply-editorial-gate.mjs

      - name: Inject Private-safe summaries
        run: node scripts/inject-private-summaries.mjs

      - name: Annotate Project Families and Making Principles
        run: node scripts/inject-showcase.mjs

      - name: Split summaries and on-demand details
        run: node scripts/split-project-data.mjs

      - name: Verify generated page
        run: |
          test -s index.html
          test -s data/patterns.json
          test -s data/editorial-review.json
          test ! -e data/project-summaries.json
          test -d data/project-details
          test "$(find data/project-details -type f -name '*.json' | wc -l)" -gt 0
          ! grep -qi 'jszip' index.html
          ! grep -qi 'loader.js' index.html
          ! grep -q '__BUILD_DIARY_DATA__' index.html
          grep -q 'window.BUILD_DIARY_DATA' index.html
          grep -q 'window.WORKS_PORTFOLIO_SHOWCASE' index.html
          grep -q 'window.WORKS_PORTFOLIO_CONFIG' index.html
          ! grep -q 'WORKS_PORTFOLIO_REPOSITORIES' index.html
          ! grep -q 'WORKS_PORTFOLIO_START_DATES' index.html
          grep -q 'worksportfolio-assets-version' index.html
          grep -q 'worksportfolio-data-mode' index.html
          grep -q 'projectDetailCache' index.html
          grep -q 'data/project-details/' index.html
          ! grep -q '"firstBuild":' index.html
          ! grep -q '"currentAnswer":' index.html
          grep -Rq '"firstBuild"' data/project-details
          grep -q 'home-shell.js' index.html
          grep -q 'home-shell.css' index.html
          grep -q 'catalog.js' index.html
          grep -q 'catalog.css' index.html
          grep -q 'data-header-search-input' index.html
          grep -q 'data-home-friction="reduce"' index.html
          grep -q 'data-home-surprise' index.html
          grep -q 'すべての制作物' index.html
          grep -q 'startedAt' index.html
          grep -q 'portfolioFamilies' index.html
          grep -q 'makingPrinciples' index.html
          ! grep -q 'live-index.js' index.html
          ! grep -q 'friction-atlas.js' index.html
          ! grep -q 'random-three.js' index.html
          ! grep -q 'catalog-list-first.js' index.html
          ! grep -q 'catalog-visibility.js' index.html
          ! grep -q 'showcase.js' index.html
          ! grep -q 'private-source.js' index.html
          ! grep -q 'WORKS_PORTFOLIO_LAZY_ASSETS' index.html
          ! grep -q 'requestIdleCallback' index.html
          grep -q 'data/projects.json' scripts/build-static-site.mjs
          grep -q 'src/index.template.html' scripts/build-static-site.mjs
          ! grep -q "readFileSync(join(root, 'index.html')" scripts/build-static-site.mjs
          grep -q 'Source not public' catalog.js
          ! grep -q 'location.reload' home-shell.js
          ! grep -q 'location.reload' catalog.js
          ! grep -q 'MutationObserver' home-shell.js
          ! grep -q 'MutationObserver' catalog.js
          grep -q 'UI Cleaner' index.html
          grep -q 'Prompt Launcher' index.html
          ! grep -q 'github.com/silovar-uk/uicleaner' index.html
          ! grep -q 'github.com/silovar-uk/private-memo' index.html
          ! grep -q 'github.com/silovar-uk/prompt-caller' index.html
          grep -q '"publicRepositoriesOnly": true' data/editorial-review.json
          ! grep -qi 'private-memo' data/editorial-review.json
          ! grep -qi 'karaoke-db' data/editorial-review.json
          ! grep -qi 'prompt-caller' data/editorial-review.json
          ! grep -qi 'uicleaner' data/editorial-review.json

      - name: Enforce core UX contract
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const headerSearchCount = (html.match(/data-header-search-input/g) || []).length;
          if (headerSearchCount !== 1) throw new Error(`Expected one Header Search, got ${headerSearchCount}`);
          if (!html.includes('<html lang="ja" class="home-redesign">')) throw new Error('Stable home class missing');
          if (!html.includes('id="home-start-title"') || !html.includes('id="home-frictions-title"')) throw new Error('Static discovery sections missing');
          const forbidden = ['WORKS_PORTFOLIO_LAZY_ASSETS', 'requestIdleCallback', 'live-index.js', 'friction-atlas.js', 'catalog-list-first.js'];
          for (const marker of forbidden) if (html.includes(marker)) throw new Error(`Deferred assembly returned: ${marker}`);
          console.log('Core UX contract OK: static shell + unified search + canonical catalog.');
          NODE

      - name: Enforce performance budget
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const marker = 'window.BUILD_DIARY_DATA =';
          const start = html.indexOf(marker) + marker.length;
          const end = html.indexOf('</script>', start);
          if (start < marker.length || end < 0) throw new Error('Cannot measure BUILD_DIARY_DATA.');
          const diaryBytes = Buffer.byteLength(html.slice(start, end).trim().replace(/;\s*$/, ''));
          const indexBytes = Buffer.byteLength(html);
          const INDEX_BUDGET = 170000;
          const DIARY_BUDGET = 100000;
          if (indexBytes > INDEX_BUDGET) throw new Error(`index.html performance budget exceeded: ${indexBytes} > ${INDEX_BUDGET}`);
          if (diaryBytes > DIARY_BUDGET) throw new Error(`inline diary performance budget exceeded: ${diaryBytes} > ${DIARY_BUDGET}`);
          console.log(`Performance budget OK: index ${indexBytes}/${INDEX_BUDGET} bytes; inline diary ${diaryBytes}/${DIARY_BUDGET} bytes.`);
          NODE

      - name: Show generated changes
        run: git diff --stat -- data/projects.json data/portfolio-config.json data/catalog.json data/editorial-review.json data/project-start-dates.json data/pattern-audit.json data/pattern-candidates-01.json data/pattern-candidates-02.json data/pattern-candidates-03.json data/pattern-merge-rules.json data/patterns.json data/project-details index.html

      - name: Commit generated files when changed
        if: github.event_name != 'pull_request'
        run: |
          FILES="data/projects.json data/portfolio-config.json data/catalog.json data/editorial-review.json data/project-start-dates.json data/pattern-audit.json data/pattern-candidates-01.json data/pattern-candidates-02.json data/pattern-candidates-03.json data/pattern-merge-rules.json data/patterns.json data/project-details index.html"
          if [ -z "$(git status --porcelain -- $FILES)" ]; then
            echo "Portfolio and derived data are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $FILES
          git commit -m "Build canonical static portfolio"
          git pull --rebase origin main
          git push
