name: Update portfolio catalog

on:
  workflow_dispatch:
  schedule:
    - cron: '15 21 * * *'
  push:
    branches:
      - main
    paths:
      - 'data/portfolio-config.json'
      - 'data/manual-projects.json'
      - 'scripts/build-catalog.mjs'
      - '.github/workflows/update-catalog.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build GitHub catalog
        run: node scripts/build-catalog.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit catalog when changed
        run: |
          if git diff --quiet -- data/catalog.json; then
            echo "Catalog is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json
          git commit -m "Update portfolio catalog"
          git push
