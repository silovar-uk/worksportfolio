name: Build portfolio site

on:
  workflow_dispatch:
  schedule:
    - cron: '15 21 * * *'
  pull_request:
    branches:
      - main
    paths:
      - '.bootstrap/**'
      - 'data/portfolio-config.json'
      - 'data/manual-projects.json'
      - 'taxonomy.js'
      - 'taxonomy.css'
      - 'scripts/build-catalog.mjs'
      - 'scripts/build-static-site.mjs'
      - '.github/workflows/update-catalog.yml'
  push:
    branches:
      - main
    paths:
      - '.bootstrap/**'
      - 'data/portfolio-config.json'
      - 'data/manual-projects.json'
      - 'taxonomy.js'
      - 'taxonomy.css'
      - 'scripts/build-catalog.mjs'
      - 'scripts/build-static-site.mjs'
      - '.github/workflows/update-catalog.yml'

permissions:
  contents: write

concurrency:
  group: worksportfolio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check interface scripts
        run: node --check taxonomy.js

      - name: Build GitHub catalog
        run: node scripts/build-catalog.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build static portfolio
        run: node scripts/build-static-site.mjs

      - name: Verify generated page
        run: |
          test -s index.html
          ! grep -qi 'jszip' index.html
          ! grep -qi 'loader.js' index.html
          grep -q 'window.BUILD_DIARY_DATA' index.html
          grep -q 'shelf-priority.js' index.html

      - name: Show generated changes
        run: git diff --stat -- data/catalog.json index.html

      - name: Commit generated files when changed
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- data/catalog.json index.html; then
            echo "Portfolio is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json index.html
          git commit -m "Build static portfolio"
          git push
