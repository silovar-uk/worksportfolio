name: Build portfolio site

on:
  workflow_dispatch:
  schedule:
    - cron: '15 21 * * *'
  pull_request:
    branches:
      - main
    paths:
      - '.bootstrap/**'
      - 'data/portfolio-config.json'
      - 'data/manual-projects.json'
      - 'taxonomy.js'
      - 'taxonomy.css'
      - 'floating-random.js'
      - 'floating-random.css'
      - 'random-three.js'
      - 'random-three.css'
      - 'comparison-view.js'
      - 'comparison-view.css'
      - 'copy-cleanup.js'
      - 'copy-cleanup.css'
      - 'scripts/build-catalog.mjs'
      - 'scripts/build-static-site.mjs'
      - 'scripts/apply-copy-cleanup.mjs'
      - '.github/workflows/update-catalog.yml'
  push:
    branches:
      - main
    paths:
      - '.bootstrap/**'
      - 'data/portfolio-config.json'
      - 'data/manual-projects.json'
      - 'taxonomy.js'
      - 'taxonomy.css'
      - 'floating-random.js'
      - 'floating-random.css'
      - 'random-three.js'
      - 'random-three.css'
      - 'comparison-view.js'
      - 'comparison-view.css'
      - 'copy-cleanup.js'
      - 'copy-cleanup.css'
      - 'scripts/build-catalog.mjs'
      - 'scripts/build-static-site.mjs'
      - 'scripts/apply-copy-cleanup.mjs'
      - '.github/workflows/update-catalog.yml'

permissions:
  contents: write

concurrency:
  group: worksportfolio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check interface scripts
        run: |
          node --check taxonomy.js
          node --check floating-random.js
          node --check random-three.js
          node --check comparison-view.js
          node --check copy-cleanup.js
          node --check scripts/apply-copy-cleanup.mjs

      - name: Build GitHub catalog
        run: node scripts/build-catalog.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build static portfolio
        run: node scripts/build-static-site.mjs

      - name: Apply natural copy
        run: node scripts/apply-copy-cleanup.mjs

      - name: Verify generated page
        run: |
          test -s index.html
          ! grep -qi 'jszip' index.html
          ! grep -qi 'loader.js' index.html
          grep -q 'window.BUILD_DIARY_DATA' index.html
          grep -q 'shelf-priority.js' index.html
          grep -q 'floating-random.js' index.html
          grep -q 'floating-random.css' index.html
          grep -q 'random-three.js' index.html
          grep -q 'random-three.css' index.html
          grep -q 'comparison-view.js' index.html
          grep -q 'comparison-view.css' index.html
          grep -q 'copy-cleanup.js' index.html
          grep -q 'copy-cleanup.css' index.html
          grep -q '小さな不便から、<br>小さな道具を作る' index.html
          grep -q 'data-view-button="shelf">一覧を見る</button>' index.html
          grep -q "d.settings.defaultView='shelf'" index.html
          grep -q '確認状況' copy-cleanup.js
          grep -q 'ランダムに3件' random-three.js
          grep -q '比較カード' comparison-view.js
          ! grep -q 'catalog-taxonomy-head strong' copy-cleanup.js
          ! grep -q '<button class="text-action" type="button" data-random-button>' index.html

      - name: Show generated changes
        run: git diff --stat -- data/catalog.json index.html

      - name: Commit generated files when changed
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- data/catalog.json index.html; then
            echo "Portfolio is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/catalog.json index.html
          git commit -m "Build static portfolio"
          git push
