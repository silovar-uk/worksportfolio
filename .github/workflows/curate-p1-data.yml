name: Curate P1 portfolio data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/curate-p1-data.mjs'
      - '.github/workflows/curate-p1-data.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: worksportfolio-p1-curation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  curate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply P1 curation
        run: |
          node --check scripts/curate-p1-data.mjs
          node scripts/curate-p1-data.mjs
      - name: Commit canonical metadata
        run: |
          if [ -z "$(git status --porcelain -- data/projects.json data/portfolio-config.json)" ]; then
            echo "P1 curation is already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/projects.json data/portfolio-config.json
          git commit -m "Curate P1 portfolio metadata"
          git pull --rebase origin main
          git push
