name: Rebuild portfolio with Techniques

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rebuild-techniques-entry.yml'

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build static portfolio
        run: node scripts/build-static-site.mjs

      - name: Apply natural copy
        run: node scripts/apply-copy-cleanup.mjs

      - name: Inject favorite catalog controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          tag = '<script src="favorite-catalog.js?v=${{ github.sha }}"></script>'
          if 'favorite-catalog.js' not in html:
              html = html.replace('</body>', tag + '</body>')
          path.write_text(html, encoding='utf-8')
          PY

      - name: Verify Techniques is included
        run: |
          grep -q '"id":"techniques"' index.html || grep -q '"id": "techniques"' index.html
          grep -q 'Techniques' index.html

      - name: Commit generated page and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/rebuild-techniques-entry.yml
          git add index.html
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Build portfolio with Techniques"
          git push
